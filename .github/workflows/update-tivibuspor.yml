name: tivibu Canlı Yayın Adresini Güncelle

on:
  schedule:
    # Her gün 06:00 ve 18:00 UTC'de çalışır (isteğe göre ayarlayın)
    - cron: '0 6,18 * * *'
  workflow_dispatch:   # Manuel tetikleme için

jobs:
  update-stream:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Commit atabilmek için

    steps:
      - name: Depoyu klonla
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıkları yükle
        run: pip install requests

      - name: Güncel yayın adresini al
        run: |
          python find_stream.py \
            "https://streams.uzunmuhalefet.com/stream/e47153e0-42fe-4980-8570-e840d1cc1cf4.m3u8" \
            "stream_url.m3u8"

      - name: Değişiklikleri commit et ve pushla
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stream_url.m3u8
          # Yalnızca gerçekten değişiklik varsa commit yap
          if git diff --cached --quiet; then
            echo "Herhangi bir değişiklik yok."
          else
            git commit -m "Otomatik güncelleme: yeni yayın adresi [skip ci]"
            git push
          fi
