name: Tivibu Spor Bağlantısını Güncelle

on:
  schedule:
    # Her gün 06:00 ve 18:00 UTC'de çalışır (isteğe göre değiştirin)
    - cron: '0 3,6,9,12,15,18,21,0 * * *'
  workflow_dispatch:   # Manuel tetikleme

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Depoya commit atabilmek için

    steps:
      - name: Depoyu klonla
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıkları yükle
        run: pip install requests

      - name: Playlist dosyasını güncelle
        run: |
          python update_playlist.py \
            "https://streams.uzunmuhalefet.com/stream/e47153e0-42fe-4980-8570-e840d1cc1cf4.m3u8" \
            "playlist.m3u"

      - name: Değişiklikleri commit et ve pushla
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Tivibu Spor bağlantısı güncellendi [skip ci]"
            git push
          fi
