name: Tivibuspor Link Updater

on:
  schedule:
    - cron: '*/30 * * * *'     # Her 30 dakikada bir çalışır
  workflow_dispatch:           # Manuel olarak da tetikleyebilirsin

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository'yi Çek
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gereksinimleri Yükle
        run: pip install requests

      - name: Linki Güncelle
        run: python tivibu.py

      - name: Değişiklikleri Kaydet ve Push'la
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tivibuspor_live.txt tivibuspor.m3u
          git commit -m "Auto update: Tivibuspor link updated" || echo "No changes to commit"
          git push
