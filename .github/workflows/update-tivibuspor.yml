name: M3U8 Otomatik Güncelleyici

on:
  schedule:
    - cron: '*/55 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-m3u8:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Repo Klonla
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Kütüphaneleri Yükle
        run: pip install requests

      - name: 🔄 M3U8 Güncelle
        run: python m3u8_updater.py

      - name: 📤 Değişiklikleri Kaydet
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add tivibu.m3u8
          git diff --staged --quiet || git commit -m "🔄 M3U8 güncellendi - $(date +'%Y-%m-%d %H:%M:%S')"
          git push
