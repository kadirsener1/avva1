name: Avva Sports Link Güncelle 8 saat

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılık Kur
        run: pip install requests

      - name: Linkleri Güncelle
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scrape_avva.py
