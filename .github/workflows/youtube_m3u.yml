name: Youtube Güncelleyici

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'YouTube/channels.txt'
      - 'YouTube/generate_m3u.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu klonla
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları yükle
        run: pip install requests

      - name: M3U dosyasını güncelle
        run: python YouTube/generate_m3u.py

      - name: Değişiklikleri commit et
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add playlist.m3u
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
          else
            git commit -m "📡 playlist.m3u güncellendi"
            git push
          fi
