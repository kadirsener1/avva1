name: Update YouTube Playlist

on:
  schedule:
    - cron: '0 */6 * * *' # Her 6 saatte bir otomatik çalışır
  workflow_dispatch: # GitHub web sitesinden tek tıkla manuel çalıştırma

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yt-dlp requests

      - name: Run generate_m3u.py
        run: python YouTube/generate_m3u.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add YouTube/playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update playlist.m3u" && git push)
