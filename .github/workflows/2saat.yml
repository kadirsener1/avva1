name: Avva Sports Link Güncelle 2 saat

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write  # M3U dosyasını repoya yazabilmek için yetki

jobs:
  update:
    runs-on: ubuntu-24.04  # Ubuntu sürüm uyarısını engellemek için sabit sürüme geçtik

    steps:
      - name: Checkout
        uses: actions/checkout@v5  # Güncel checkout adımı

      - name: Python Kur
        uses: actions/setup-python@v6  # Güncel setup-python adımı
        with:
          python-version: '3.11'

      - name: Bağımlılık Kur
        run: pip install requests

      - name: Linkleri Güncelle ve M3U Yaz
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scrape_avvason.py

      - name: Playlist Dosyasını Git ile Gönder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik playlist.m3u güncellemesi: $(date +'%Y-%m-%d %H:%M:%S')" && git push)
